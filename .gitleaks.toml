# gitleaks: the default rules, minus the dummy values CI builds with.
# To accept a finding that isn't a secret, add its fingerprint (printed by
# gitleaks) to .gitleaksignore. A real secret must be rotated instead.

[extend]
useDefault = true

[[allowlists]]
description = "Dummy secrets for CI builds"
paths = ['''(^|/)secrets\.yaml\.example$''']
