# Door controller on the ESP32-S3 access-control board: one Wiegand reader
# (J5), an access database pushed over HTTP, syslog reporting and a door strike.
# Board: hw/reader/0.1.1 (ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB octal PSRAM);
# reader pins as in examples/simple.yaml.
substitutions:
  access_site_controller_name: "Front door"
  # Wiegand reader 1 (J5), level-shifted to 5V on the board.
  wiegand_d0_pin: GPIO18
  wiegand_d1_pin: GPIO17
  # The reader's LED and beeper lines are pulled low to switch on.
  wiegand_led_pin: GPIO16
  wiegand_beep_pin: GPIO15
  wiegand_led_inverted: "true"
  wiegand_beep_inverted: "true"
  # TODO(owner): the board has no relay output; these are placeholders on the
  # J1 header (IO38, IO39) until the wiring is decided. Not GPIO19/20: those are
  # the S3's USB pins.
  door_relay_1_pin: GPIO38
  door_relay_2_pin: GPIO39

esphome:
  name: access-control
  friendly_name: Access Control
  comment: Wiegand door controller, ESP32-S3 access-control board

# The C++ components live in components/ at the repo root. Other projects use
#   source: github://romkey/esp32-access-control@vX.Y.Z
external_components:
  - source:
      type: local
      path: ../components

packages:
  base: !include common/base.yaml
  access-door: !include ../packages/access-door.yaml

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# 8MB octal PSRAM (uses GPIO35-37 internally, so avoid those pins)
psram:
  mode: octal
  speed: 80MHz
